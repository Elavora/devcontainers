name: PHP development image

on:
  # Só PRs que mexem no ambiente constroem a imagem; sem push na main (a publicação constrói na tag).
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - php.ini
      - tests/smoke.php
      - 'scripts/**'
      - .github/workflows/image.yml
  repository_dispatch:
    types: [tag-created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref }}
      - name: Build
        run: docker build --pull -t elavora/php-dev:8.3 .
      - name: Validate tools and user
        run: docker run --rm elavora/php-dev:8.3 php /usr/local/share/elavora/smoke.php
      - name: Publish version
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -eu
          # Valida a tag antes do login: se falhar, nada é publicado.
          refs=$(sh scripts/image-tags.sh "$RELEASE_TAG")
          # A primeira linha é sempre a referência versionada.
          version_ref=$(printf '%s\n' "$refs" | sed -n 1p)
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          # Só a versionada não pode existir; a referência móvel é sobrescrita de propósito.
          sh scripts/image-absent.sh "$version_ref"
          # Envia na ordem impressa: a versionada antes da móvel.
          for ref in $refs; do
            docker tag elavora/php-dev:8.3 "$ref"
            docker push "$ref"
          done
