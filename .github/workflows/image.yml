name: PHP development image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --pull -t elavora/php-dev:8.3 .
      - name: Validate tools and user
        run: docker run --rm elavora/php-dev:8.3 php /usr/local/share/elavora/smoke.php
      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          image="ghcr.io/elavora/php-dev:8.3-${RELEASE_TAG}"
          docker tag elavora/php-dev:8.3 "$image"
          docker push "$image"
